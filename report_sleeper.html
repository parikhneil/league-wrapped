<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>League History: Sleeper</title><style>:root {
  --bg: #f7f9fc;
  --fg: #182234;
  --muted: #59677e;
  --line: #dce3ef;
  --head: #eef3fa;
  --accent: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827;
    --fg: #e5edf9;
    --muted: #a7b4c8;
    --line: #334155;
    --head: #1e293b;
    --accent: #93c5fd;
  }
}
* {
  box-sizing: border-box;
}
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 20px 64px;
}
h1 {
  font-size: 38px;
  letter-spacing: -1px;
}
h2 {
  margin-top: 30px;
}
h3 {
  margin-top: 28px;
}
.sub,
#status {
  color: var(--muted);
  line-height: 1.6;
}
input,
select,
button {
  font: inherit;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--head);
  color: var(--fg);
  padding: 9px 12px;
}
input {
  width: min(100%, 380px);
}
button {
  cursor: pointer;
  margin: 4px 5px 4px 0;
}
button:hover {
  border-color: var(--accent);
}
button:focus-visible,
select:focus-visible,
input:focus-visible,
th:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
button.on {
  background: var(--accent);
  color: var(--bg);
}
.manager {
  padding: 0;
  background: none;
  border: 0;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  margin: 0;
}
.feature-tabs {
  display: flex;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  padding: 12px 0;
  position: relative;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin: 22px 0;
}
.card {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--head);
  padding: 20px;
  line-height: 1.6;
}
.card span {
  display: block;
  color: var(--muted);
  font-size: 14px;
}
.card strong {
  display: block;
  font-size: 27px;
  overflow-wrap: anywhere;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}
label {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin: 5px 0;
}
.scroll {
  overflow-x: auto;
  margin: 16px 0;
  border: 1px solid var(--line);
  border-radius: 10px;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}
th,
td {
  padding: 10px 13px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
}
th {
  background: var(--head);
  cursor: pointer;
}
th::after {
  content: " ↕";
  opacity: 0.4;
}
th.asc::after {
  content: " ▲";
}
th.desc::after {
  content: " ▼";
}
summary {
  cursor: pointer;
  padding: 12px 0;
  font-weight: 600;
}
a {
  color: var(--accent);
}
.chart {
  overflow-x: auto;
  margin-top: 20px;
}
.chart svg {
  width: 100%;
  min-width: 600px;
  color: var(--muted);
}
.chart text {
  fill: currentColor;
  font-family: system-ui;
  font-size: 12px;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.legend span {
  padding-left: 8px;
  font-size: 13px;
}
.recap-preview {
  border: 1px solid var(--line);
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}
@media (max-width: 600px) {
  body {
    padding: 18px 12px;
  }
  h1 {
    font-size: 30px;
  }
  .cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .card {
    padding: 12px;
  }
  .card strong {
    font-size: 22px;
  }
  .feature-tabs button {
    font-size: 13px;
  }
}

.select-field {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.recap-image {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
  border-radius: 10px;
  margin-bottom: 14px;
}
</style></head><body><h1>League History: Sleeper</h1><nav><a href="report.html">Combined</a> <a href="report_espn.html">ESPN</a> <a href="report_sleeper.html">Sleeper</a> <a href="players.html">Players</a></nav><p class="sub">Saved snapshot. Active season results are provisional. <a href="index.html">Live dashboard</a></p><div id="out"></div><script>/* Shared calculations for live leagues, saved reports, and Node verification. */
(function (root) {
  "use strict";
  const fresh = () => ({
    w: 0,
    l: 0,
    t: 0,
    pf: 0,
    pa: 0,
    seasons: 0,
    po: 0,
    titles: 0,
    finals: 0,
    actual: 0,
    expected: 0,
    played: 0,
    apw: 0,
    apl: 0,
    apt: 0,
    streak: 0,
    bestStreak: 0,
  });
  const rate = (a) =>
    a.w + a.l + a.t ? (a.w + a.t / 2) / (a.w + a.l + a.t) : 0;
  function analyze(seasons, namesOverride = {}) {
    const D = {
      names: {},
      all: {},
      champs: [],
      scores: [],
      h2h: {},
      playoffH2h: {},
      consolationH2h: {},
      bySeason: [],
      weeks: [],
      games: [],
      drafts: [],
      moves: [],
      comebacks: [],
      sources: seasons,
    };
    const A = (u) => (D.all[u] ??= fresh());
    for (const s of seasons) {
      const L = s.league,
        label = `${L.season} (${s.src})`,
        owner = Object.fromEntries(
          s.rosters.map((r) => [r.roster_id, r.owner_id]),
        );
      s.users.forEach(
        (u) =>
          (D.names[u.user_id] =
            u.display_name || u.full_name || String(u.user_id)),
      );
      const done = L.status === "complete",
        start = L.settings?.playoff_week_start || 15;
      const cutoff = L.settings?.last_scored_leg ?? (done ? 18 : 0);
      const po = new Set(
        done
          ? L.playoff_roster_ids ||
            s.bracket.flatMap((m) =>
              ["t1", "t2", "w", "l"].map((k) => m[k]).filter(Number.isInteger),
            )
          : [],
      );
      const rows = s.rosters
        .filter((r) => r.owner_id)
        .map((r) => {
          const st = r.settings || {},
            a = A(r.owner_id),
            row = {
              uid: r.owner_id,
              w: st.wins || 0,
              l: st.losses || 0,
              t: st.ties || 0,
              pf: (st.fpts || 0) + (st.fpts_decimal || 0) / 100,
              pa: (st.fpts_against || 0) + (st.fpts_against_decimal || 0) / 100,
            };
          ["w", "l", "t", "pf", "pa"].forEach((k) => (a[k] += row[k]));
          if (row.w + row.l + row.t) a.seasons++;
          if (po.has(r.roster_id)) a.po++;
          return row;
        })
        .sort((a, b) => rate(b) - rate(a) || b.pf - a.pf);
      const fin = done ? s.bracket.find((m) => m.p === 1) : null,
        champ = owner[fin?.w],
        runner = owner[fin?.l];
      if (champ) {
        A(champ).titles++;
        A(champ).finals++;
      }
      if (runner) A(runner).finals++;
      D.champs.push({ season: label, champ, runner, top: rows[0]?.uid });
      D.bySeason.push({
        season: label,
        year: String(L.season),
        src: s.src,
        rows,
        champ,
        po: [...po].map((r) => owner[r]),
      });
      const cumulative = Object.fromEntries(
          rows.map((r) => [r.uid, { w: 0, l: 0, t: 0, pf: 0 }]),
        ),
        ranks = {},
        streaks = {};
      const rank = () =>
        Object.keys(cumulative).sort(
          (a, b) =>
            rate(cumulative[b]) - rate(cumulative[a]) ||
            cumulative[b].pf - cumulative[a].pf ||
            a.localeCompare(b),
        );
      (s.weeks || []).forEach((wk, i) => {
        const week = i + 1;
        if (
          week > cutoff ||
          week >= start ||
          !wk?.some((m) => Number(m.points) !== 0)
        )
          return;
        const teams = wk.filter(
            (m) => owner[m.roster_id] && m.matchup_id != null,
          ),
          groups = {};
        teams.forEach((m) => (groups[m.matchup_id] ??= []).push(m));
        const valid = Object.values(groups).filter((p) => p.length === 2),
          eligible = valid.flat();
        if (!eligible.length) return;
        const prev = week === 1 ? [] : rank(),
          games = [],
          scores = [];
        for (const me of eligible) {
          const uid = owner[me.roster_id],
            pts = Number(me.points) || 0,
            others = eligible.filter((x) => x.roster_id !== me.roster_id),
            a = A(uid);
          const wins = others.filter(
              (x) => pts > (Number(x.points) || 0),
            ).length,
            ties = others.filter((x) => pts === (Number(x.points) || 0)).length;
          a.apw += wins;
          a.apt += ties;
          a.apl += others.length - wins - ties;
          a.expected += (wins + ties / 2) / others.length;
          a.played++;
          scores.push({ uid, pts });
          D.scores.push([pts, uid, label, week]);
        }
        for (const [a, b] of valid) {
          const ua = owner[a.roster_id],
            ub = owner[b.roster_id],
            pa = Number(a.points) || 0,
            pb = Number(b.points) || 0;
          const winner = pa > pb ? ua : pb > pa ? ub : null,
            loser = winner === ua ? ub : winner === ub ? ua : null;
          const priorGap = winner
            ? rate(cumulative[loser]) - rate(cumulative[winner])
            : 0;
          const g = {
            season: label,
            week,
            a: ua,
            b: ub,
            pa,
            pb,
            winner,
            loser,
            margin: Math.abs(pa - pb),
            upset: week > 1 && winner && priorGap > 0 ? priorGap : 0,
          };
          games.push(g);
          D.games.push(g);
          for (const [u, v, p, q] of [
            [ua, ub, pa, pb],
            [ub, ua, pb, pa],
          ]) {
            const c = cumulative[u],
              total = A(u),
              r = ((D.h2h[u] ??= {})[v] ??= [0, 0, 0]);
            c.pf += p;
            const k = p > q ? "w" : p < q ? "l" : "t";
            c[k]++;
            r[k === "w" ? 0 : k === "l" ? 1 : 2]++;
            total.actual += k === "w" ? 1 : k === "t" ? 0.5 : 0;
            streaks[u] = k === "w" ? (streaks[u] || 0) + 1 : 0;
            total.bestStreak = Math.max(total.bestStreak, streaks[u]);
          }
        }
        const next = rank(),
          changes = next.map((uid, j) => ({
            uid,
            rank: j + 1,
            change: prev.length ? prev.indexOf(uid) - j : 0,
          }));
        next.forEach((u, j) => (ranks[u] ??= []).push(j + 1));
        D.weeks.push({ season: label, week, games, scores, changes });
      });
      const finalRanks = rank();
      for (const u of finalRanks) {
        if (ranks[u]?.length > 1)
          D.comebacks.push({
            uid: u,
            season: label,
            from: Math.max(...ranks[u]),
            to: finalRanks.indexOf(u) + 1,
            gain: Math.max(...ranks[u]) - finalRanks.indexOf(u) - 1,
          });
      }
      // Postseason recaps include bye scores, but never alter regular-season luck or ranks.
      (s.weeks || []).forEach((wk, i) => {
        if (
          i + 1 < start ||
          i + 1 > cutoff ||
          !wk?.some((m) => Number(m.points) !== 0)
        )
          return;
        const groups = {},
          scores = [];
        for (const m of wk) {
          if (!owner[m.roster_id]) continue;
          scores.push({ uid: owner[m.roster_id], pts: Number(m.points) || 0 });
          if (m.matchup_id != null) (groups[m.matchup_id] ??= []).push(m);
        }
        const games = Object.values(groups)
          .filter((p) => p.length === 2)
          .map(([a, b]) => {
            const pa = Number(a.points) || 0,
              pb = Number(b.points) || 0,
              ua = owner[a.roster_id],
              ub = owner[b.roster_id];
            return {
              season: label,
              week: i + 1,
              a: ua,
              b: ub,
              pa,
              pb,
              winner: pa > pb ? ua : pb > pa ? ub : null,
              loser: pa > pb ? ub : pb > pa ? ua : null,
              margin: Math.abs(pa - pb),
              upset: 0,
            };
          });
        if (scores.length)
          D.weeks.push({
            season: label,
            week: i + 1,
            games,
            scores,
            changes: [],
            postseason: true,
          });
      });
      const addBracket = (map, w, l) => {
        const a = owner[w],
          b = owner[l];
        if (!a || !b) return;
        ((map[a] ??= {})[b] ??= [0, 0, 0])[0]++;
        ((map[b] ??= {})[a] ??= [0, 0, 0])[1]++;
      };
      if (s.src === "Sleeper") {
        for (const m of s.bracket || [])
          if (Number.isInteger(m.w) && Number.isInteger(m.l))
            addBracket(D.playoffH2h, m.w, m.l);
        for (const m of s.losersBracket || [])
          if (Number.isInteger(m.w) && Number.isInteger(m.l))
            addBracket(D.consolationH2h, m.w, m.l);
      } else {
        (s.weeks || []).forEach((wk, i) => {
          if (i + 1 < start || i + 1 > cutoff) return;
          const groups = {};
          for (const m of wk || [])
            if (m.matchup_id != null) (groups[m.matchup_id] ??= []).push(m);
          for (const pair of Object.values(groups)) {
            if (pair.length !== 2) continue;
            const [a, b] = pair;
            if (!a.bracket || a.bracket === "NONE" || a.points === b.points)
              continue;
            addBracket(
              a.bracket === "WINNERS_BRACKET" ? D.playoffH2h : D.consolationH2h,
              a.points > b.points ? a.roster_id : b.roster_id,
              a.points > b.points ? b.roster_id : a.roster_id,
            );
          }
        });
      }
      const playerName = (pid, meta = {}) =>
        (s.players?.[pid]?.name !== pid ? s.players?.[pid]?.name : null) ||
        `${meta.first_name || ""} ${meta.last_name || ""}`.trim() ||
        String(pid);
      const contribution = (pid, rid, from = 1, to = cutoff) => {
        let pts = 0,
          starts = 0,
          rostered = 0;
        for (let w = from; w <= Math.min(to, cutoff); w++) {
          const m = s.weeks[w - 1]?.find((x) => x.roster_id === rid);
          if (!m || !s.weeks[w - 1]?.some((x) => Number(x.points) !== 0))
            continue;
          if (s.src === "ESPN" && !m.players_points)
            return { pts: null, starts: null, rostered: null };
          if (m.players?.includes(pid)) rostered++;
          if (m.starters?.includes(pid)) {
            starts++;
            pts += Number(m.players_points?.[pid]) || 0;
          }
        }
        return { pts, starts, rostered };
      };
      for (const p of s.picks || []) {
        const available =
          p.player_id_kind !== "local_placeholder" &&
          s.weeks.some((wk) => wk.some((m) => m.players_points));
        const v = available
          ? contribution(p.player_id, p.roster_id)
          : { pts: null, starts: null, rostered: null };
        D.drafts.push({
          season: label,
          src: s.src,
          uid: owner[p.roster_id],
          player: playerName(p.player_id, p.metadata),
          pos: p.metadata?.position || "",
          round: p.round,
          pick: p.pick_no,
          ...v,
        });
      }
      const transactions = (s.transactions || [])
        .filter((t) => t.status === "complete")
        .sort(
          (a, b) =>
            (a.status_updated || a.created) - (b.status_updated || b.created),
        );
      for (const t of transactions) {
        const when = t.status_updated || t.created,
          from = (Number(t.leg) || 1) + 1;
        const adds = Object.entries(t.adds || {}).map(([pid, rid]) => {
          const exit = transactions.find(
            (x) =>
              (x.status_updated || x.created) > when && x.drops?.[pid] === rid,
          );
          return {
            player: playerName(pid),
            uid: owner[rid],
            ...contribution(pid, rid, from, exit ? Number(exit.leg) : cutoff),
          };
        });
        D.moves.push({
          id: t.transaction_id,
          season: label,
          type: t.type,
          details_incomplete: t.details_incomplete || false,
          week: t.leg,
          date: when,
          adds,
          drops: Object.entries(t.drops || {}).map(([pid, rid]) => ({
            player: playerName(pid),
            uid: owner[rid],
          })),
          picks: t.draft_picks || [],
          budget: t.waiver_budget || [],
        });
      }
    }
    Object.assign(D.names, namesOverride);
    for (const d of D.drafts) {
      const peers = D.drafts.filter(
        (x) => x.season === d.season && x.round === d.round && x.pts !== null,
      );
      d.value =
        d.pts === null || !peers.length
          ? null
          : d.pts - peers.reduce((sum, x) => sum + x.pts, 0) / peers.length;
    }
    D.rivalries = [];
    const ids = Object.keys(D.all);
    ids.forEach((a, i) =>
      ids.slice(i + 1).forEach((b) => {
        const r = D.h2h[a]?.[b];
        if (r) {
          D.rivalries.push({
            a,
            b,
            w: r[0],
            l: r[1],
            t: r[2],
            games: r.reduce((x, y) => x + y, 0),
            balance: Math.abs(r[0] - r[1]),
          });
        }
      }),
    );
    return D;
  }
  const api = { analyze, rate };
  if (typeof module !== "undefined") module.exports = api;
  root.LeagueStats = api;
})(typeof window !== "undefined" ? window : globalThis);

/* Shared dashboard for live and saved league history. */
(function (root) {
  "use strict";
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
  const raw = (html) => ({ html }),
    num = (x) => (x === null ? "—" : Number(x || 0).toFixed(2)),
    rec = (a) => `${a.w}-${a.l}${a.t ? "-" + a.t : ""}`,

  function table(headers, rows) {
    return `<div class="scroll"><table class="sortable"><thead><tr>${headers.map((h) => `<th scope="col" tabindex="0">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.length ? rows.map((r) => `<tr>${r.map((c) => `<td${Array.isArray(c) ? ` data-v="${esc(c[1])}"` : ""}>${c?.html !== undefined ? c.html : esc(Array.isArray(c) ? c[0] : c)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${headers.length}">No data available for this selection.</td></tr>`}</tbody></table></div>`;
  }
  function mount(el, seasons, names = {}) {
    const D = root.LeagueStats.analyze(seasons, names),
      n = (u) => D.names[u] || "Unknown",
      ids = Object.keys(D.all).sort((a, b) => n(a).localeCompare(n(b)));
    const manager = (u) =>
      raw(
        `<button class="manager" data-manager="${esc(u)}">${esc(n(u))}</button>`,
      );
    let section = el.dataset.activeSection || "overview",
      selected = ids.includes(el.dataset.selectedManager)
        ? el.dataset.selectedManager
        : ids[0],
      weekIndex = D.weeks.length - 1,
      chartSource = "all",
      chartMetric = "pf",
      chartManager = "all",
      draftSeason = "all",
      moveSeason = "all",
      moveType = "all",
      moveManager = "all";
    const options = (items, chosen) =>
      items
        .map(
          ([v, t]) =>
            `<option value="${esc(v)}"${String(v) === String(chosen) ? " selected" : ""}>${esc(t)}</option>`,
        )
        .join("");
    const select = (id, label, items, chosen) =>
      `<span class="select-field"><label for="${id}">${esc(label)}</label> <select id="${id}">${options(items, chosen)}</select></span>`;
    const rosterName = (label, rid) =>
      n(
        D.sources
          .find((s) => `${s.league.season} (${s.src})` === label)
          ?.rosters.find((r) => r.roster_id === rid)?.owner_id,
      );
    const seasonOptions = [
      ["all", "All seasons"],
      ...D.bySeason.map((s) => [s.season, s.season]),
    ];
    const managerOptions = [
      ["all", "All managers"],
      ...ids.map((u) => [u, n(u)]),
    ];
    const metricCards = (a) =>
      `<div class="cards">${[
        ["Record", rec(a)],
        ["Win %", num(root.LeagueStats.rate(a) * 100) + "%"],
        ["Titles", a.titles],
        ["Playoffs", a.po],
        ["Expected wins", num(a.expected)],
        ["Schedule luck", signed(a.actual - a.expected)],
      ]
        .map(
          ([k, v]) =>
            `<div class="card"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`,
        )
        .join("")}</div>`;
    function overview() {
      return (
        '<h2>All-time standings</h2><p class="sub">Click a manager for their profile. Records and points use platform season totals.</p>' +
        table(
          [
            "Manager",
            "Seasons",
            "Record",
            "Win %",
            "PF/game",
            "PA/game",
            "Points for",
            "Points against",
            "Playoffs",
            "Titles",
            "Finals",
          ],
          ids
            .slice()
            .sort(
              (a, b) =>

    function lineChart(points, yLabel) {
      if (!points.length) return "<p>No scores available.</p>";
      const series = [
          ...new Set(points.flatMap((p) => p.values.map((v) => v.uid))),
        ],
        max = Math.max(
          1,
          ...points.flatMap((p) => p.values.map((v) => v.value)),
        ),
        W = 900,
        H = 310,
        left = 62,
        right = 30,
        top = 20,
        bottom = 90,
        x = (i) =>
          left + (i * (W - left - right)) / Math.max(1, points.length - 1),
        y = (v) => H - bottom - (v / max) * (H - top - bottom);
      let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yLabel)} comparison"><title>${esc(yLabel)} comparison</title>`;
      for (let i = 0; i <= 4; i++) {
        const v = (max * i) / 4;
        svg += `<line x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".15"/><text x="${left - 8}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`;
      }
      series.forEach((uid, j) => {
        let segment = [];
        const flush = () => {
          if (segment.length)
            svg += `<polyline fill="none" stroke="${colors[j % colors.length]}" stroke-width="2" points="${segment.join(" ")}"/>`;
          segment = [];
        };
        points.forEach((p, i) => {
          const v = p.values.find((v) => v.uid === uid);
          if (!v) {
            flush();
            return;
          }
          segment.push(`${x(i)},${y(v.value)}`);
          svg += `<circle cx="${x(i)}" cy="${y(v.value)}" r="4" fill="${colors[j % colors.length]}"><title>${esc(n(uid))}: ${num(v.value)} · ${esc(p.label)}</title></circle>`;
        });
        flush();
      });
      points.forEach((p, i) => {
        if (
          points.length > 16 &&
          i % Math.ceil(points.length / 12) !== 0 &&
          i !== points.length - 1
        )
          return;
        svg += `<text transform="translate(${x(i)},${H - bottom + 18}) rotate(25)" font-size="10">${esc(p.label)}</text>`;
      });
      svg += "</svg>";
      return `<div class="chart">${svg}</div><div class="legend">${series.map((u, i) => `<span style="border-left:4px solid ${colors[i % colors.length]}">${esc(n(u))}</span>`).join("")}</div>`;
    }
