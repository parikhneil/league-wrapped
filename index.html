<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>League Wrapped</title>
    <link rel="stylesheet" href="league.css" />
    <link rel="stylesheet" href="chat-widget.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>League Wrapped</h1>
      <div data-feature-nav></div>
    </header>
    <!-- Loading a league, the platform switch and its status line all belong to
         the main menu. syncMenuOnly hides this block on every other tab, so a
         feature page is just that feature. -->
    <div id="menu-only">
      <p class="sub">
        Enter a Sleeper league ID (or your Sleeper username to pick a league) to
        see its full history.
      </p>
      <input id="q" placeholder="League ID or username" autocomplete="off" />
      <button id="go">Load league</button><button id="reset">Our league</button>
      <div id="picker"></div>
      <div id="tabs"></div>
      <p id="status"></p>
    </div>
    <div id="out"></div>
    <script src="espn_league.js"></script>
    <script src="league-data.js"></script>
    <script src="league-stats.js"></script>
    <script src="trade-analysis.js"></script>
    <script src="comeback-history.js"></script>
    <script src="league-ui.js"></script>
    <script src="chat-widget.js" defer></script>
    <script>
      const DEFAULT_LEAGUE = "1381121078079795200";
      const API = "https://api.sleeper.app/v1";
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const get = async (p) => {
        const r = await fetch(API + p, { signal: AbortSignal.timeout(20000) });
        if (!r.ok) throw new Error(r.status);
        return r.json();
      };
      const setStatus = (t) => {
        $("status").textContent = t;
      };

      async function loadHistory(id, version) {
        const seasons = [],
          visited = new Set();
        while (id && id !== "0") {
          if (visited.has(id))
            throw new Error("Season history contains a cycle");
          visited.add(id);
          if (version === requestVersion)
            setStatus(
              `Loading league ${id}… (${seasons.length} season(s) so far)`,
            );
          const league = await get(`/league/${id}`);
          if (!league?.league_id) throw new Error("League not found");
          const missing = [],
            savedFallbacks = [],
            saved = window.LEAGUE_SNAPSHOT?.find(
              (s) =>
                s.src === "Sleeper" &&
                String(s.league.league_id) === String(league.league_id),
            );
          const optional = (label, path, savedWeek) =>
            get(path).catch(() => {
              if (Array.isArray(savedWeek) && savedWeek.length) {
                savedFallbacks.push(label);
                return structuredClone(savedWeek);
              }
              missing.push(label);
              return [];
            });
          const [users, rosters, bracket, weeks, losersBracket] =
            await Promise.all([
              get(`/league/${id}/users`),
              get(`/league/${id}/rosters`),
              optional("Playoff bracket", `/league/${id}/winners_bracket`),
              Promise.all(
                Array.from({ length: 18 }, (_, i) =>
                  optional(
                    `Week ${i + 1} matchups`,
                    `/league/${id}/matchups/${i + 1}`,
                    saved?.weeks?.[i],
                  ),
                ),
              ),
              optional("Consolation bracket", `/league/${id}/losers_bracket`),
            ]);
          if (version === requestVersion)
            setStatus(
              `Loading draft and transaction history for ${league.season}…`,
            );
          const drafts = await optional("Draft list", `/league/${id}/drafts`);
          const [picks, transactions] = await Promise.all([
            Promise.all(
              (drafts || []).map((d) =>
                optional("Draft picks", `/draft/${d.draft_id}/picks`),
              ),
            ).then((a) => a.flat()),
            Promise.all(
              Array.from({ length: 18 }, (_, i) =>
                optional(
                  `Week ${i + 1} transactions`,
                  `/league/${id}/transactions/${i + 1}`,
                ),
              ),
            ).then((a) => a.flat()),
          ]);
          seasons.push({
            league,
            users,
            rosters,
            bracket: bracket || [],
            losersBracket: losersBracket || [],
            weeks,
            picks,
            transactions,
            missing,
            savedFallbacks,
          });
          id = league.previous_league_id;
        }
        return seasons.reverse();
      }

      let loaded = null,
        requestVersion = 0;
      let playerNames = null;
      function view(mode) {
        const { sl, espn, isDefault } = loaded;
        const seasons =
          mode === "sleeper"
            ? sl
            : mode === "espn"
              ? espn
              : [...sl, ...espn].sort((a, b) =>
                  String(a.league.season).localeCompare(
                    String(b.league.season),
                  ),
                );
        LeagueUI.mount(
          $("out"),
          seasons,
          isDefault ? window.LEAGUE_NAMES || {} : {},
        );
        document
          .querySelectorAll("#tabs button")
          .forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
      }

      // LeagueUI owns which section is showing, so the page follows its
      // data-active-section instead of tracking the tabs itself.
      const menuOnly = $("menu-only");
      const syncMenuOnly = () => {
        menuOnly.hidden = ($("out").dataset.activeSection || "home") !== "home";
      };
      new MutationObserver(syncMenuOnly).observe($("out"), {
        attributes: true,
        attributeFilter: ["data-active-section"],
      });
      syncMenuOnly();

      async function run(id) {
        const version = ++requestVersion;
        $("picker").innerHTML = "";
        try {
          const sl = await loadHistory(id, version),
            isDefault = id === DEFAULT_LEAGUE;
          if (version !== requestVersion) return;
          if (!playerNames) {
            try {
              const players = await get("/players/nfl");
              playerNames = Object.fromEntries(
                Object.entries(players).map(([id, p]) => [
                  id,
                  {
                    name:
                      p.full_name ||
                      `${p.first_name || ""} ${p.last_name || ""}`.trim() ||
                      id,
                    position: p.position || "",
                    fantasy_positions:
                      p.fantasy_positions || (p.position ? [p.position] : []),
                    gsis_id: p.gsis_id || null,
                    espn_id: p.espn_id || null,
                    team: p.team || null,
                  },
                ]),
              );
            } catch (_) {
              playerNames =
                window.LEAGUE_SNAPSHOT?.find((s) => s.src === "Sleeper")
                  ?.players || {};
            }
          }
          if (version !== requestVersion) return;
          sl.forEach((s) => {
            s.src = "Sleeper";
            s.players = playerNames;
            const saved = window.LEAGUE_SNAPSHOT?.find(
              (existing) =>
                existing.src === "Sleeper" &&
                existing.league.league_id === s.league.league_id,
            );
            s.opportunity = saved?.opportunity || null;
            s.comebackHistory = saved?.comebackHistory || null;
            if (saved?.players) {
              s.players = { ...playerNames };
              for (const [id, historical] of Object.entries(saved.players)) {
                const live = playerNames[id] || {};
                s.players[id] = {
                  ...live,
                  ...historical,
                  gsis_id: historical.gsis_id || live.gsis_id || null,
                  espn_id: historical.espn_id || live.espn_id || null,
                };
              }
            }
          });
          const espn = isDefault ? window.ESPN_SEASONS || [] : [];
          loaded = { sl, espn, isDefault };
          if (espn.length)
            $("tabs").innerHTML = [
              ["combined", "Combined"],
              ["sleeper", "Sleeper"],
              ["espn", "ESPN"],
            ]
              .map(([m, t]) => `<button data-mode="${m}">${t}</button>`)
              .join("");
          view("combined");
          setStatus(
            `Loaded ${sl.length} Sleeper season(s)${espn.length ? ` + ${espn.length} ESPN season(s)` : ""}. Click a column header to sort.`,
          );
        } catch (e) {
          if (version !== requestVersion) return;
          setStatus(
            `Couldn't refresh that league (${e.message}). ${loaded ? "The saved dashboard is still available." : "Check the ID and try again."}`,
          );
        }
      }

      async function byUsername(name) {
        try {
          const u = await get(`/user/${encodeURIComponent(name)}`);
          const y = new Date().getFullYear();
          const lists = await Promise.all(
            [y, y - 1].map((yr) =>
              get(`/user/${u.user_id}/leagues/nfl/${yr}`).catch(() => []),
            ),
          );
          const leagues = lists.flat();
          $("picker").innerHTML = leagues.length
            ? leagues
                .map(
                  (l) =>
                    `<button data-id="${esc(l.league_id)}">${esc(l.name)} (${esc(l.season)})</button>`,
                )
                .join("")
            : "No leagues found for that user.";
          setStatus(leagues.length ? "Pick a league:" : "");
        } catch (e) {
          setStatus(`Couldn't find that username (${e.message}).`);
        }
      }

      $("go").onclick = () => {
        const v = $("q").value.trim();
        if (v) /^\d{10,}$/.test(v) ? run(v) : byUsername(v);
      };
      $("q").addEventListener(
        "keydown",
        (e) => e.key === "Enter" && $("go").click(),
      );
      $("reset").onclick = () => {
        $("q").value = "";
        run(DEFAULT_LEAGUE);
      };
      $("tabs").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) view(b.dataset.mode);
      });
      $("picker").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) run(b.dataset.id);
      });
      if (window.LEAGUE_SNAPSHOT?.length) {
        loaded = {
          sl: window.LEAGUE_SNAPSHOT.filter((s) => s.src === "Sleeper"),
          espn: window.LEAGUE_SNAPSHOT.filter((s) => s.src === "ESPN"),
          isDefault: true,
        };
        $("tabs").innerHTML = [
          ["combined", "Combined"],
          ["sleeper", "Sleeper"],
          ["espn", "ESPN"],
        ]
          .map(([m, t]) => `<button data-mode="${m}">${t}</button>`)
          .join("");
        view("combined");
        setStatus(
          "Showing the saved league snapshot while refreshing live data…",
        );
      }
      run(DEFAULT_LEAGUE);
    </script>
  </body>
</html>
