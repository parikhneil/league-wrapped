name: Weekly update

on:
  schedule:
    - cron: "0 10 * * 2"   # Tuesdays at 10:00 UTC (6am EDT / 5am EST)
  workflow_dispatch:        # lets you run it by hand from GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore saved Sleeper and NFL data   # finished seasons don't re-download
        uses: actions/cache@v4
        with:
          path: |
            data
            data_nfl
          key: league-data-${{ github.run_id }}
          restore-keys: league-data-
      - run: pip install requests
      - run: python fetch_sleeper_history.py
      - run: python fetch_nfl_opportunity.py --no-build
      - name: Reconstruct historical game-day comebacks
        run: python fetch_comeback_history.py --no-build
        continue-on-error: true   # Public NFL outages must not block the weekly report.
      - run: python build_report.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add report.html report_sleeper.html report_espn.html players.html espn_league.js league-data.js
          git diff --cached --quiet || git commit -m "Weekly update"
          git push
