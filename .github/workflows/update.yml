name: Weekly update

on:
  schedule:
    - cron: "0 10 * * 2"   # Tuesdays at 10:00 UTC (6am Eastern)
  workflow_dispatch:        # lets you run it by hand from GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore saved Sleeper data
        uses: actions/cache@v4
        with:
          path: data
          key: sleeper-data-${{ github.run_id }}
          restore-keys: sleeper-data-
      - run: pip install requests
      - run: python fetch_sleeper_history.py
      - run: python build_report.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add report.html report_sleeper.html report_espn.html players.html espn_league.js player_names.js
          git diff --cached --quiet || git commit -m "Weekly update"
          git push
