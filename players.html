<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; --head:#f4f4f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15171a; --fg:#e8e8e8; --muted:#9aa0a6; --line:#2c2f33; --head:#1f2226; } }
  body { font-family: -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); max-width:1200px; margin:0 auto; padding:24px 16px 64px; }
  nav a { margin-right: 14px; } .sub { color:var(--muted); }
  input { width:100%; max-width:420px; padding:8px 10px; font-size:16px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  #list button { display:block; width:100%; max-width:420px; text-align:left; padding:8px 10px; border:1px solid var(--line); border-top:0; background:var(--head); color:var(--fg); cursor:pointer; font-size:14px; }
  table { border-collapse:collapse; width:100%; font-size:14px; } .scroll { overflow-x:auto; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; } th { background:var(--head); }
  small { color:var(--muted); font-weight:normal; }
</style><style>.league-guide {
  --lg-bg: var(--bg, #f7f9fc);
  --lg-fg: var(--fg, #182234);
  --lg-muted: var(--muted, #59677e);
  --lg-line: var(--line, #dce3ef);
  --lg-head: var(--head, #eef3fa);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--lg-fg);
}
.league-guide *,
.league-guide *::before,
.league-guide *::after {
  box-sizing: border-box;
}
.league-guide [hidden] {
  display: none !important;
}
.league-guide button,
.league-guide textarea,
.league-guide a {
  font: inherit;
}
.league-guide button {
  margin: 0;
  cursor: pointer;
}
.league-guide button:disabled {
  cursor: default;
  opacity: 0.55;
}
.league-guide button:focus-visible,
.league-guide textarea:focus-visible,
.league-guide a:focus-visible,
.lg-transcript:focus-visible {
  outline: 3px solid var(--accent, #2563eb);
  outline-offset: 3px;
}
.lg-launcher {
  position: fixed;
  z-index: 900;
  right: max(20px, env(safe-area-inset-right));
  bottom: max(20px, env(safe-area-inset-bottom));
  border: 1px solid #243c90;
  border-radius: 999px;
  background: #2448b9;
  color: #fff;
  padding: 13px 20px;
  font-weight: 650 !important;
  box-shadow: 0 5px 20px #101d4433;
}
.lg-launcher:hover {
  background: #1e3c9c;
  border-color: #1e3c9c;
}
.lg-panel {
  position: fixed;
  z-index: 901;
  right: max(20px, env(safe-area-inset-right));
  bottom: calc(max(20px, env(safe-area-inset-bottom)) + 64px);
  display: flex;
  flex-direction: column;
  width: min(440px, calc(100vw - 40px));
  max-height: min(720px, calc(100vh - 116px));
  max-height: min(720px, calc(100dvh - 116px));
  background: var(--lg-bg);
  border: 1px solid var(--lg-line);
  border-radius: 20px;
  box-shadow: 0 16px 64px #09152c38;
  overflow: hidden;
}
.lg-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 20px 13px;
  flex: 0 0 auto;
  background: var(--lg-head);
}
.lg-eyebrow {
  display: block;
  color: var(--lg-muted);
  font-size: 10px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 1.3px;
}
.league-guide .lg-title {
  margin: 2px 0 0;
  font-size: 23px;
  line-height: 1.25;
  letter-spacing: -0.6px;
}
.lg-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.lg-reset,
.lg-close {
  border: 1px solid var(--lg-line);
  border-radius: 8px;
  background: var(--lg-bg);
  color: var(--lg-fg);
}
.lg-reset {
  padding: 7px 9px;
  font-size: 11px !important;
  white-space: nowrap;
}
.lg-close {
  padding: 1px 8px;
  font-size: 25px !important;
  line-height: 1.3;
}
.lg-context {
  margin: 0;
  padding: 10px 20px;
  font-size: 11px;
  color: var(--lg-muted);
  border-bottom: 1px solid var(--lg-line);
  flex: 0 0 auto;
}
.lg-transcript {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 20px;
  min-height: 0;
  max-height: 380px;
  flex: 1 1 auto;
  scrollbar-width: thin;
}
.league-guide .lg-welcome h3 {
  margin: 0 0 7px;
  font-size: 20px;
  letter-spacing: -0.4px;
}
.lg-welcome p {
  margin: 0;
  color: var(--lg-muted);
  font-size: 13px;
}
.lg-prompts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 18px;
}
.lg-prompt {
  border: 1px solid var(--lg-line);
  border-radius: 10px;
  background: var(--lg-head);
  color: var(--lg-fg);
  padding: 11px 10px;
  text-align: left;
  font-size: 12px !important;
}
.lg-message + .lg-message {
  margin-top: 18px;
}
.lg-message {
  min-width: 0;
}
.lg-message-label {
  margin: 0 0 5px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
  color: var(--lg-muted);
}
.lg-message-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
  font-size: 13px;
}
.lg-user {
  padding: 12px 14px;
  background: var(--lg-head);
  border: 1px solid var(--lg-line);
  border-radius: 12px;
}
.lg-assistant {
  padding: 0 2px;
}
.lg-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}
.league-guide .lg-source {
  display: inline-block;
  border: 1px solid var(--lg-line);
  border-radius: 999px;
  padding: 5px 9px;
  text-decoration: none;
  background: var(--lg-head);
  color: var(--accent, #2563eb);
  font-size: 11px;
}
.lg-feedback {
  flex: 0 0 auto;
  padding: 0 20px;
}
.lg-status {
  margin: 0;
  font-size: 12px;
  color: var(--lg-muted);
}
.lg-status:not(:empty) {
  padding: 7px 0;
}
.lg-retry {
  border: 1px solid var(--lg-line);
  border-radius: 7px;
  padding: 5px 9px;
  background: var(--lg-head);
  color: var(--lg-fg);
  font-size: 11px !important;
  margin-bottom: 8px !important;
}
.lg-form {
  padding: 12px 20px 0;
  border-top: 1px solid var(--lg-line);
  flex: 0 0 auto;
}
.lg-input-label {
  display: block;
  font-size: 11px;
  font-weight: 650;
  margin-bottom: 6px;
}
.league-guide .lg-input {
  display: block;
  width: 100%;
  resize: vertical;
  min-height: 65px;
  max-height: 140px;
  border: 1px solid var(--lg-line);
  border-radius: 10px;
  background: var(--lg-bg);
  color: var(--lg-fg);
  padding: 10px 12px;
  line-height: 1.45;
  font-size: 13px;
}
.lg-form-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 0;
}
.lg-count {
  color: var(--lg-muted);
  font-size: 10px;
}
.lg-send {
  background: #2448b9;
  color: #fff;
  border: 1px solid #2448b9;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px !important;
  font-weight: 650 !important;
}
.lg-send:hover {
  background: #1e3c9c;
  border-color: #1e3c9c;
}
.lg-privacy {
  flex: 0 0 auto;
  margin: 0;
  padding: 0 20px 14px;
  color: var(--lg-muted);
  font-size: 10px;
  line-height: 1.45;
}
@media (max-width: 520px) {
  .lg-launcher {
    right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    padding: 11px 16px;
    font-size: 13px !important;
  }
  .lg-panel {
    right: 12px;
    bottom: calc(max(12px, env(safe-area-inset-bottom)) + 58px);
    width: calc(100vw - 24px);
    max-height: calc(100vh - 90px);
    max-height: calc(100dvh - 90px);
    border-radius: 16px;
  }
  .lg-header {
    padding: 14px 16px 11px;
  }
  .lg-context {
    padding: 8px 16px;
  }
  .lg-transcript {
    padding: 16px;
  }
  .lg-feedback {
    padding: 0 16px;
  }
  .lg-form {
    padding: 10px 16px 0;
  }
  .league-guide .lg-input {
    font-size: 16px;
  }
  .lg-privacy {
    padding: 0 16px 12px;
  }
}
@media (prefers-reduced-motion: no-preference) {
  .lg-launcher {
    transition:
      background 0.15s ease,
      box-shadow 0.15s ease;
  }
}
@media (max-height: 520px) {
  .lg-panel {
    bottom: 10px;
    max-height: calc(100dvh - 20px);
  }
  .lg-header {
    padding-top: 10px;
    padding-bottom: 9px;
  }
  .lg-eyebrow {
    display: none;
  }
  .lg-context {
    font-size: 10px;
    padding-top: 5px;
    padding-bottom: 5px;
  }
  .league-guide .lg-input {
    min-height: 48px;
    max-height: 70px;
  }
  .lg-privacy {
    padding-bottom: 7px;
  }
}
</style></head><body>

        );
      throw error;
    } finally {
      window.clearTimeout(timer);
    }
  }
  async function boot() {
    if (session) return Boolean(session.configured);
    if (bootPromise) return bootPromise;
    bootPromise = (async () => {
      setBusy(true);
      if (!/^https?:$/.test(window.location.protocol)) {
        feedbackText(
          "Open this report through the chat server to use LeagueGuide: run node server.mjs, then open the address it prints.",
        );
        setBusy(false);
        return false;
      }
      feedbackText("Connecting to LeagueGuide…");
      try {
        const data = await request("/api/chat/session");
        if (
          typeof data.csrfToken !== "string" ||
          typeof data.configured !== "boolean"
        )
          throw new Error(
            "LeagueGuide returned an invalid session. Try again.",
          );
        session = data;
        feedbackText(
          session.configured
            ? ""
            : "LeagueGuide hasn’t been configured by the site owner yet.",
        );
        return session.configured;
      } catch (error) {
        feedbackText(error.message, boot);
        return false;
      } finally {
        setBusy(false);
      }
    })();
    try {
      return await bootPromise;
    } finally {
      bootPromise = null;
    }
  }
  function appendMessage(role, text, sources = []) {
    const message = node("article", `lg-message lg-${role}`);
    message.append(
      node("p", "lg-message-label", role === "user" ? "You" : "LeagueGuide"),
    );
    message.append(node("p", "lg-message-text", text));
    if (Array.isArray(sources) && sources.length) {
      const links = node("div", "lg-sources");
      links.setAttribute("aria-label", "Related sections");
      for (const source of sources.slice(0, 6)) {
        if (
          !source ||
          !sections.has(source.section) ||
          typeof source.label !== "string"
        )
          continue;
        const target = document.querySelector(
          `#out .feature-tabs button[data-section="${source.section}"]`,
        );
        if (target) {
          const b = button("lg-source", source.label.slice(0, 120));
          b.onclick = () => {
            document
              .querySelector(
                `#out .feature-tabs button[data-section="${source.section}"]`,
              )
              ?.click();
            hide();
            document
              .querySelector(
                `#out .feature-tabs button[data-section="${source.section}"]`,
              )
              ?.focus();
          };
          links.append(b);
        } else {
          const link = node(
            "a",
            "lg-source",
            `${source.label.slice(0, 120)} ↗`,
          );
          link.href =
            source.section === "players" ? "players.html" : "index.html";
          link.setAttribute(
            "aria-label",
            `${source.label.slice(0, 120)} — open ${source.section === "players" ? "players" : "dashboard"}`,
          );
          links.append(link);
        }
      }
      if (links.childElementCount) message.append(links);
    }
    transcript.append(message);
    transcript.scrollTop = transcript.scrollHeight;
  }
  async function send(message, retrying = false) {
    const text = message.trim();
    if (!text || text.length > 1500 || busy) return;
    setBusy(true);
    if (!(await boot())) {
      setBusy(false);
      return;
    }
    setBusy(true);
    if (!retrying) {
      welcome.hidden = true;
      appendMessage("user", text);
      input.value = "";
    }
    feedbackText("Looking at the league data…");
    try {
      const response = await request("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Chat-CSRF": session.csrfToken,
        },
        body: JSON.stringify({ message: text, selection: selection() }),
      });
      if (typeof response.answer !== "string" || !response.answer.trim())
        throw new Error("LeagueGuide didn’t return an answer. Try again.");
      appendMessage(
        "assistant",
        response.answer.slice(0, 24000),
        response.sources,
      );
      feedbackText("");
    } catch (error) {
      feedbackText(error.message, () => send(text, true));
    } finally {
      setBusy(false);
      if (!panel.hidden && !input.disabled)
        input.focus({ preventScroll: true });
    }
  }
  function hide() {
    panel.hidden = true;
    launcher.setAttribute("aria-expanded", "false");
    launcher.focus({ preventScroll: true });
  }
  launcher.onclick = async () => {
    if (!panel.hidden) {
      hide();
      return;
    }
    panel.hidden = false;
    launcher.setAttribute("aria-expanded", "true");
    updateContext();
    close.focus({ preventScroll: true });
    const connected = await boot();
    if (connected && !panel.hidden) input.focus({ preventScroll: true });
  };
  close.onclick = hide;
  panel.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      event.preventDefault();
      hide();
    }
  });
  input.addEventListener("input", updateCount);
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    send(input.value);
  });
  retry.onclick = () => retryAction?.();
  reset.onclick = async () => {
    if (busy || !session) return;
    setBusy(true);
    feedbackText("Starting a new chat…");
    try {
      const result = await request("/api/chat/session", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Chat-CSRF": session.csrfToken,
        },
        body: "{}",
      });
      if (
        typeof result.csrfToken !== "string" ||
        typeof result.configured !== "boolean"
      )
        throw new Error("Couldn’t start a new chat. Please try again.");
      session = result;
      transcript.replaceChildren(welcome);
      welcome.hidden = false;
      input.value = "";
      feedbackText(
        session.configured
          ? ""
          : "LeagueGuide hasn’t been configured by the site owner yet.",
      );
    } catch (error) {
      feedbackText(error.message);
    } finally {
      setBusy(false);
      if (!input.disabled) input.focus({ preventScroll: true });
    }
  };
  const out = document.getElementById("out");
  if (out)
    new MutationObserver(updateContext).observe(out, {
      attributes: true,
      attributeFilter: [
        "data-active-section",
        "data-chat-manager",
        "data-chat-season",
        "data-chat-platform",
        "data-chat-scope",
        "data-chat-games",
        "data-chat-trade",
        "data-chat-matchup",
        "data-chat-position",
      ],
    });
  setBusy(false);
  updateContext();
})();
</script></body></html>
